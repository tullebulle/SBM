# DiT-XL/1 with RAE's wide DDT head (sbm_rae.models.dit.DiT_XL_1_DH): 21 trunk blocks at width 1152 + 2 head blocks at
# 2048; 669.4 M parameters on the RAE DINOv2-S latent (16x16 tokens of 384 channels, the defaults below; override
# input_size / in_channels for other latents).
name: DiT-XL/1-DH
input_size: 16
in_channels: 384
mlp_ratio: 4.0
label_dim: ${dataset.num_classes}
learn_sigma: false
qk_norm: false
attn_func: fa3
is_zero_data: true
dropout: 0.0
